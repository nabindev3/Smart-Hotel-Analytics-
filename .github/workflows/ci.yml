name: Smart Hotel Analytics — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual trigger for the heavy training smoke test
  schedule:
    # Nightly model drift check at 02:00 UTC
    - cron: "0 2 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smart-hotel-analytics

jobs:
  # ══════════════════════════════════════════════
  # 1. LINT + UNIT TESTS  (fast — no model training)
  # ══════════════════════════════════════════════
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Slim install: the test suite runs against the committed model/data
      # artifacts and only needs the serving deps + test tooling — not the full
      # 250-line requirements.txt (tensorflow, jupyter, …). `-e .` installs the
      # backend/src packages so imports work without sys.path hacks.
      - name: Install dependencies
        run: |
          # prod deps + test tooling. pandera is a data-contract dep used by the
          # schema tests; it stays out of requirements.prod.txt so the serving
          # image isn't burdened with it.
          pip install -r requirements.prod.txt pytest pytest-asyncio httpx ruff pandera
          # Frontend deps (streamlit/plotly) so the dashboard smoke test can run.
          pip install -r requirements.frontend.txt
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check backend scripts tests frontend src

      # Hard prerequisite: fail loudly if committed artifacts are missing, so the
      # suite can't "pass" by skipping every data/model-dependent test.
      - name: Verify artifacts present
        run: |
          python - <<'PY'
          import os, sys
          required = ["models/cancellation_model.joblib", "models/feature_config.joblib",
                      "models/recommender.joblib", "data/bookings.csv", "data/daily_kpis.csv"]
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              sys.exit("Missing committed artifacts: " + ", ".join(missing))
          print("All required artifacts present.")
          PY

      # The serving image must carry the library for whichever engine the saved
      # model uses (the lightgbm-vs-xgboost footgun from before).
      - name: Verify prod deps match the saved model engine
        run: python scripts/check_prod_deps.py

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/

  # ══════════════════════════════════════════════
  # 1b. TRAINING SMOKE TEST  (heavy — manual / on demand)
  # ══════════════════════════════════════════════
  # Full data-gen + training exercises the heavy pipeline (Prophet, N-BEATS,
  # calibration, MLflow). It's minutes long and needs the full requirements, so
  # it runs on manual dispatch instead of every push/PR.
  train-smoke:
    name: Training Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Generate synthetic data
        run: python src/generate_data.py
      - name: Train models
        run: python src/train_models_ts.py
      - name: Run unit tests on freshly trained models
        run: pytest tests/ -v --tb=short

  # ══════════════════════════════════════════════
  # 2. BUILD & PUSH DOCKER IMAGES
  # ══════════════════════════════════════════════
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════
  # 3. NIGHTLY DRIFT CHECK
  # ══════════════════════════════════════════════
  drift-check:
    name: Nightly Model Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run drift check
        run: |
          python src/train_models_ts.py --check-drift

      - name: Trigger retrain if drift detected
        run: |
          if grep -q '"drift_detected": true' monitoring/drift_report.json 2>/dev/null; then
            echo "⚠️ Drift detected — triggering retraining"
            python src/train_models_ts.py --force-retrain
          else
            echo "✅ No drift detected"
          fi

      - name: Notify on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Model Drift Detected',
              body: 'Nightly drift check failed. Models may need retraining.',
              labels: ['model-drift', 'automated']
            })
